<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — QR Code Manager SaaS</title>
  <script src="js/tailwindcss.js"></script>
  <script>if(!window.tailwind){document.write('<script src="https://cdn.tailwindcss.com"><\/script>')}</script>
  <script src="js/gsap.min.js"></script>
  <script>if(!window.gsap){document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"><\/script>')}</script>
  <script src="js/motion-fx.js"></script>
  <script src="js/auth.js"></script>
  <style>
    :root {
      --ink: #17161D;
      --muted: #666371;
      --page: #F5F4F7;
      --surface: #FEFDFE;
      --line: #E4E1E8;
      --brand: #5B43D6;
      --brand-soft: #EEEAFE;
      --success: #16794B;
      --danger: #B43B47;
    }
  </style>
</head>
<body class="bg-[#F5F4F7] text-[#17161D] min-h-screen flex flex-col justify-between font-sans antialiased selection:bg-[#EEEAFE] relative overflow-x-hidden">

  <!-- Ambient Glowing Blurred Orbs -->
  <div class="fixed top-12 left-1/4 w-96 h-96 bg-[#5B43D6]/15 rounded-full blur-3xl pointer-events-none -z-10 animate-pulse"></div>
  <div class="fixed bottom-12 right-1/4 w-96 h-96 bg-[#16794B]/10 rounded-full blur-3xl pointer-events-none -z-10"></div>

  <!-- Top Simple Nav -->
  <header class="py-4 px-6 flex items-center justify-between relative z-10">
    <a href="index.html" class="flex items-center gap-2.5 text-decoration-none">
      <div class="w-8 h-8 rounded-xl bg-[#5B43D6] text-white flex items-center justify-center font-bold shadow-md shadow-[#5B43D6]/25">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 14h3v3h-3z"/></svg>
      </div>
      <span class="font-bold text-lg tracking-tight text-[#17161D]">QR<span class="text-[#5B43D6]">Manager</span></span>
    </a>
    <div class="text-xs text-[#666371]">
      Don't have an account? <a href="register.html" class="text-[#5B43D6] font-semibold hover:underline">Start free trial</a>
    </div>
  </header>

  <!-- Login Card Container -->
  <main class="flex-1 flex items-center justify-center px-4 py-8 relative z-10">
    <div id="authCard" class="max-w-md w-full bg-[#FEFDFE]/90 backdrop-blur-2xl border border-white/80 rounded-3xl p-7 sm:p-9 shadow-[0_20px_50px_-15px_rgba(91,67,214,0.15)] relative">
      
      <!-- Card Header -->
      <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-[#EEEAFE] text-[#5B43D6] mb-3">
          <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
        </div>
        <h1 class="text-2xl font-extrabold text-[#17161D] tracking-tight">Sign in to your account</h1>
        <p class="text-xs text-[#666371] mt-1.5">Enter your credentials to access your QR workspaces</p>
      </div>

      <!-- Error Alert Box -->
      <div id="errorBanner" class="hidden mb-5 p-3 rounded-xl bg-red-50 border border-red-200 text-xs text-red-700 flex items-start gap-2">
        <svg class="w-4 h-4 flex-shrink-0 mt-0.5 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="errorMessage" class="flex-1 leading-relaxed">Invalid credentials.</span>
      </div>

      <!-- Form -->
      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        
        <!-- Email Input -->
        <div>
          <label class="block text-xs font-semibold text-[#17161D] mb-1.5">Work Email</label>
          <input type="email" id="email" required autocomplete="email" placeholder="name@company.com" class="w-full px-3.5 py-2.5 rounded-lg border border-[#E4E1E8] text-xs text-[#17161D] bg-[#FEFDFE] focus:outline-none focus:border-[#5B43D6] focus:ring-1 focus:ring-[#5B43D6] transition-all" />
        </div>

        <!-- Password Input -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="block text-xs font-semibold text-[#17161D]">Password</label>
            <a href="forgot-password.html" class="text-[11px] text-[#5B43D6] hover:underline font-medium">Forgot password?</a>
          </div>
          <div class="relative">
            <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••" class="w-full px-3.5 py-2.5 rounded-lg border border-[#E4E1E8] text-xs text-[#17161D] bg-[#FEFDFE] focus:outline-none focus:border-[#5B43D6] focus:ring-1 focus:ring-[#5B43D6] transition-all" />
            <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-2.5 text-[#666371] hover:text-[#17161D]">
              <svg id="eyeIcon" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            </button>
          </div>
        </div>

        <!-- Remember Me Checkbox -->
        <div class="flex items-center">
          <input type="checkbox" id="remember" checked class="w-3.5 h-3.5 rounded text-[#5B43D6] border-gray-300 focus:ring-[#5B43D6]">
          <label for="remember" class="ml-2 text-xs text-[#666371]">Remember me for 30 days</label>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn" class="w-full py-2.5 px-4 rounded-xl bg-[#5B43D6] text-white text-xs font-bold hover:bg-[#4d36bd] transition-all shadow-md shadow-[#5B43D6]/20 flex items-center justify-center gap-2">
          <span id="btnText">Sign In to Dashboard</span>
          <svg id="btnSpinner" class="hidden w-4 h-4 animate-spin text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        </button>
      </form>

      <!-- Divider -->
      <div class="relative my-6 text-center">
        <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-[#E4E1E8]"></div></div>
        <span class="relative bg-[#FEFDFE] px-3 text-[11px] font-semibold text-[#666371] uppercase tracking-wider">Quick Demo Login</span>
      </div>

      <!-- Quick 1-Click Demo Buttons -->
      <div class="grid grid-cols-2 gap-2 text-xs">
        <button type="button" onclick="fillDemo('owner@qrmanager.io', 'Password123!')" class="p-2.5 rounded-lg border border-[#E4E1E8] bg-[#F5F4F7] hover:bg-[#EEEAFE] hover:border-[#5B43D6] transition-all text-left">
          <div class="font-bold text-[#17161D]">👑 Platform Owner</div>
          <div class="text-[10px] text-[#666371] mt-0.5 truncate">owner@qrmanager.io</div>
        </button>
        <button type="button" onclick="fillDemo('admin@acme.com', 'Password123!')" class="p-2.5 rounded-lg border border-[#E4E1E8] bg-[#F5F4F7] hover:bg-[#EEEAFE] hover:border-[#5B43D6] transition-all text-left">
          <div class="font-bold text-[#17161D]">💼 Client Account</div>
          <div class="text-[10px] text-[#666371] mt-0.5 truncate">admin@acme.com</div>
        </button>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="py-4 text-center text-xs text-[#666371]">
    © 2026 QR Code Manager SaaS · Protected by 256-bit encryption & rate limiting
  </footer>

  <script>
    // If already logged in, redirect to destination
    if (Auth.isLoggedIn()) {
      const urlParams = new URLSearchParams(window.location.search);
      const redirect = urlParams.get('redirect') || 'qr-dashboard.html';
      window.location.href = redirect;
    }

    function togglePasswordVisibility() {
      const pass = document.getElementById('password');
      pass.type = pass.type === 'password' ? 'text' : 'password';
    }

    function fillDemo(email, pass) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = pass;
      document.getElementById('errorBanner').classList.add('hidden');
      handleLogin(new Event('submit'));
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;
      const remember = document.getElementById('remember').checked;

      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');
      const submitBtn = document.getElementById('submitBtn');
      const errorBanner = document.getElementById('errorBanner');
      const errorMessage = document.getElementById('errorMessage');

      btnText.textContent = 'Authenticating...';
      btnSpinner.classList.remove('hidden');
      submitBtn.disabled = true;
      errorBanner.classList.add('hidden');

      const result = await Auth.login(email, pass, remember);

      if (result.success) {
        btnText.textContent = 'Success! Redirecting...';
        const urlParams = new URLSearchParams(window.location.search);
        const redirect = urlParams.get('redirect') || 'qr-dashboard.html';
        setTimeout(() => {
          window.location.href = redirect;
        }, 500);
      } else {
        errorMessage.textContent = result.error || 'Authentication failed.';
        errorBanner.classList.remove('hidden');
        btnText.textContent = 'Sign In to Dashboard';
        btnSpinner.classList.add('hidden');
        submitBtn.disabled = false;
      }
    }

    // Motion & 3D Initialization
    document.addEventListener('DOMContentLoaded', () => {
      if (window.MotionFX) {
        MotionFX.apply3DTilt('#authCard', { maxTilt: 6, scale: 1.01 });
        MotionFX.applyMagnetic('#submitBtn', 0.2);
      }
      if (window.gsap) {
        gsap.from('#authCard', {
          y: 40,
          opacity: 0,
          scale: 0.94,
          duration: 0.85,
          ease: 'power3.out'
        });
      }
    });
  </script>
</body>
</html>
